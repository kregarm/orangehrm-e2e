name: Playwright

on: [push, pull_request]

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Environment
        uses: actions/checkout@v4
        with:
          repository: orangehrm/orangehrm-os-dev-environment

      - name: Checkout OrangeHRM
        uses: actions/checkout@v4
        with:
          path: html

      - name: Configure Docker Environment
        run: |
          cp .env.dist .env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: html/src/test/functional/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Run Playwright
        run: html/bin/run-e2e
        env:
          PLAYWRIGHT_INSTALL_DEPS: "true"

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-${{ github.sha }}
          path: |
            html/src/test/functional/playwright/test-results
            html/src/test/functional/playwright-report

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-logs-${{ github.sha }}
          path: html/src/test/functional/e2e-logs
